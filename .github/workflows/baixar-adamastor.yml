name: Atualizar livros do projeto
on:
  workflow_dispatch:
  push:
    paths: ['public/books/adamastor/*.epub', 'public/books/estante/*.epub']
permissions:
  contents: write
concurrency:
  group: livros-repositorio
  cancel-in-progress: false
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/baixar-adamastor.mjs
      - run: node tools/catalogar-estante.mjs
      - name: Salvar alterações
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add public/books
          git diff --cached --quiet || git commit -m "Livros: atualizar catálogos"
          git pull --rebase -q || true
          git push
